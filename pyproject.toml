[project]
name = "cqa-workspace"
version = "0.1.0"
description = "CQA foundation workspace; business modules are intentionally unfinished"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "jsonschema==4.26.0",
  "httpx==0.28.1",
]

[tool.uv]
required-version = "==0.13.7"
package = false

[tool.uv.workspace]
members = ["packages/cqa_contracts", "packages/cqa_domain", "packages/cqa_ai", "apps/api"]

[tool.uv.sources]
cqa-contracts = { workspace = true }
cqa-domain = { workspace = true }
cqa-ai = { workspace = true }
cqa-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "apps/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".tools", ".bootstrap", ".tmp", ".uv-cache", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["packages/cqa_contracts/src", "packages/cqa_domain/src", "packages/cqa_ai/src", "apps/api/src"]
